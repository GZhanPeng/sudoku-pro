<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="经典 9×9 数独助手：全标候选、一键基础清扫与本机保存进度。">
  <meta name="theme-color" content="#535D4E">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="数独助手">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>数独助手</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f5f3ed;
    }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #535d4e;
      background: #f5f3ed;
    }
    #loading > div { text-align: center; }
    #loading-grid {
      display: grid;
      grid-template-columns: repeat(3, 14px);
      gap: 5px;
      width: max-content;
      margin: 0 auto 16px;
    }
    #loading-grid span {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: currentColor;
      animation: pulse 1.2s ease-in-out infinite alternate;
    }
    #loading-grid span:nth-child(2n) { animation-delay: .18s; opacity: .55; }
    #loading-grid span:nth-child(3n) { animation-delay: .36s; opacity: .3; }
    @keyframes pulse { to { opacity: .2; transform: scale(.82); } }
    @media (prefers-color-scheme: dark) {
      html, body, #loading { background: #111412; }
      #loading { color: #c3cab9; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="正在加载数独助手">
    <div>
      <div id="loading-grid" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <div>正在加载数独助手…</div>
    </div>
  </div>
  <noscript>数独助手需要启用 JavaScript。</noscript>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
